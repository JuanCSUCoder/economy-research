<svg xmlns="http://www.w3.org/2000/svg" width="760" height="190" viewBox="0 0 760 190" role="img">
<style>text{font-family:'DejaVu Sans',Arial,sans-serif;fill:#1f2933} .muted{fill:#6b7280} .grid{stroke:#e5e7eb;stroke-width:1} .axis{stroke:#6b7280;stroke-width:1}</style>
<rect width="760" height="190" fill="#ffffff"/>
<text x="20" y="20" font-size="15" font-weight="700">Presupuesto General de la Nación 2027: $634,9 billones</text>
<rect x="40.0" y="50" width="421.2" height="46" fill="#1f4e79"/>
<text x="250.6" y="70" font-size="10" text-anchor="middle" fill="white" font-weight="700">61,9%</text>
<text x="250.6" y="84" font-size="9" text-anchor="middle" fill="white">$393,2 bn</text>
<rect x="461.2" y="50" width="157.5" height="46" fill="#b23a48"/>
<text x="539.9" y="70" font-size="10" text-anchor="middle" fill="white" font-weight="700">23,2%</text>
<text x="539.9" y="84" font-size="9" text-anchor="middle" fill="white">$147,1 bn</text>
<rect x="618.7" y="50" width="101.4" height="46" fill="#2f6f4e"/>
<text x="669.4" y="70" font-size="10" text-anchor="middle" fill="white" font-weight="700">14,9%</text>
<text x="669.4" y="84" font-size="9" text-anchor="middle" fill="white">$94,6 bn</text>
<text x="40" y="125" font-size="11">El servicio de la deuda (23,2%) supera la inversión (14,9%). Los intereses solos absorben $94,4 billones,</text>
<text x="40" y="141" font-size="11">casi el mismo monto que toda la inversión pública del año.</text>
<text x="40" y="170" font-size="9" class="muted">Fuente: Ley de Presupuesto 2027 aprobada por el Congreso el 20 de octubre de 2026; cifras en billones de pesos corrientes.</text>
</svg>